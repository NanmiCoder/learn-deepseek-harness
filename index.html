<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9f1f2" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="读懂 DeepSeek Harness：从「模型只会说话」讲起，一路讲到插件、工具调用、多个 Agent 分工，最后自己写一个插件。"
    />
    <title>读懂 DeepSeek Harness</title>
    <script>
      (() => {
        try {
          const saved = window.localStorage.getItem("dsh-theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            theme === "dark" ? "#06171d" : "#e9f1f2",
          );
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
