<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">读懂 DeepSeek Harness</title>
  <desc id="desc">教程标题与一张 mini 节点图：用户、循环、大模型、工具四个节点，循环到会话记录的连线被点亮。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f6"/>
      <stop offset="1" stop-color="#e3edee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#paper)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="25.5" fill="none" stroke="#cfdfE1"/>

  <!-- 左侧：标题区 -->
  <g id="title-block" transform="translate(64 56)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2" fill="#017a78">交互式教程 · 20 节 · 7 阶段</text>

    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="54" font-weight="700" fill="#014e60">读懂</text>
    <text x="118" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="54" font-weight="700" fill="#019b98">DeepSeek Harness</text>

    <text y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" fill="#376f81">把 agent 框架拆开讲：从「模型只会说话」开始，</text>
    <text y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" fill="#376f81">讲到你能写出一个装进真实 DSH 的插件。</text>

    <g transform="translate(0 196)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect x="0" y="-20" width="132" height="34" rx="17" fill="#019b98"/>
      <text x="66" y="2" text-anchor="middle" fill="#ffffff">npm run dev</text>
      <text x="156" y="2" fill="#436e7d">demo/ 下全部是能跑的真代码</text>
    </g>

    <text y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#4b707e">learn-dsh.vercel.app · MIT</text>
  </g>

  <!-- 右侧：mini 节点图（复刻教程的分步演示） -->
  <g id="stage-mini" transform="translate(688 44)">
    <rect x="-16" y="-16" width="464" height="300" rx="20" fill="#ffffff" stroke="#dceaea"/>

    <!-- 连线（未点亮） -->
    <g stroke="#d3e2e4" stroke-width="2" fill="none">
      <path d="M 96 210 C 130 180, 150 130, 178 100"/>
      <path d="M 268 84 C 310 70, 330 68, 372 74"/>
      <path d="M 268 110 C 310 150, 320 180, 366 196"/>
    </g>
    <!-- 连线（点亮：循环 → 工具） -->
    <path d="M 252 116 C 290 160, 300 182, 356 200" stroke="#019b98" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="356" cy="200" r="5" fill="#019b98"/>

    <!-- 节点：外部·用户 -->
    <g transform="translate(28 196)">
      <rect width="96" height="52" rx="12" fill="#f4f8f9" stroke="#d3e2e4"/>
      <text x="48" y="22" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#436e7d">外部</text>
      <text x="48" y="40" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#014e60">用户</text>
    </g>

    <!-- 节点：内核·循环（点亮） -->
    <g transform="translate(170 62)">
      <rect width="104" height="56" rx="12" fill="#eefbfa" stroke="#019b98" stroke-width="2"/>
      <text x="52" y="23" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#017a78">内核</text>
      <text x="52" y="43" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#014e60">循环</text>
    </g>

    <!-- 节点：外部·大模型 -->
    <g transform="translate(344 48)">
      <rect width="96" height="52" rx="12" fill="#f4f8f9" stroke="#d3e2e4"/>
      <text x="48" y="22" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#436e7d">外部</text>
      <text x="48" y="40" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#014e60">大模型</text>
    </g>

    <!-- 节点：插件·工具（点亮） -->
    <g transform="translate(340 182)">
      <rect width="104" height="56" rx="12" fill="#eefbfa" stroke="#019b98" stroke-width="2"/>
      <text x="52" y="23" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#017a78">插件</text>
      <text x="52" y="43" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#014e60">工具</text>
    </g>

    <!-- 当前动作标签 -->
    <g transform="translate(150 250)">
      <rect width="196" height="26" rx="13" fill="#d5f7f5"/>
      <text x="98" y="17" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#017a78">循环 —调用→ 工具</text>
    </g>
  </g>
</svg>
